[package]
name = "artifactd-client-feedback"
version = "1.4.1"
edition = "2021"
description = "Turn user feedback into your next release with Artifactd."
readme = "README.md"
license = "MIT"
keywords = ["artifactd", "feedback", "error-reporting"]
categories = ["api-bindings"]
repository = "https://github.com/auroracorelabs/artifactd-sdk-client"
include = ["src/**", "Cargo.toml", "README.md", "LICENSE", "Cargo.lock"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
