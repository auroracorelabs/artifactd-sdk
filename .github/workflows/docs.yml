name: SDK documentation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sdk-docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: curl, json
          coverage: none
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --prefix docs/site
      - run: python -m pip install -r docs/site/requirements.txt
      - name: Generate language API references
        run: bash docs/site/build-api.sh
      - name: Build SDK documentation
        env:
          DOCS_BASE_PATH: /${{ github.event.repository.name }}/
          DOCS_ORIGIN: https://${{ github.repository_owner }}.github.io
        run: npm run build --prefix docs/site
      - run: npm test --prefix docs/site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/docs
  deploy:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy SDK documentation to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
