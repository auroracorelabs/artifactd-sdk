name: Publish SDK
on:
  workflow_call:
    inputs:
      language:
        type: string
        default: all
  workflow_dispatch:
    inputs:
      language:
        description: Registry to publish to (run from a matching vX.Y.Z tag)
        type: choice
        options: [all, python, node, rust, dotnet]
        default: all
        required: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/tags/v* ]]
          python ci/version.py --check
          test "${GITHUB_REF_NAME#v}" = "$(tr -d '\r\n' < VERSION)"
  python:
    needs: validate
    if: inputs.language == 'all' || inputs.language == 'python'
    runs-on: ubuntu-latest
    environment: sdk-release
    env:
      TWINE_USERNAME: __token__
      TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Publish to PyPI
        shell: bash
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "::warning::PYPI_TOKEN is not configured; skipping PyPI"
            [ "${{ inputs.language }}" = all ] && exit 0 || exit 1
          fi
          PYTHONPATH=packages/python/src python -m unittest discover -s packages/python/tests
          python -m pip install build twine
          python -m build packages/python
          python -m twine check packages/python/dist/*
          python -m twine upload --skip-existing packages/python/dist/*
  node:
    needs: validate
    if: inputs.language == 'all' || inputs.language == 'node'
    runs-on: ubuntu-latest
    environment: sdk-release
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Publish to npm
        shell: bash
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::NPM_TOKEN is not configured; skipping npm"
            [ "${{ inputs.language }}" = all ] && exit 0 || exit 1
          fi
          npm test --prefix packages/node
          npm publish ./packages/node --access public
  rust:
    needs: validate
    if: inputs.language == 'all' || inputs.language == 'rust'
    runs-on: ubuntu-latest
    environment: sdk-release
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io
        shell: bash
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN is not configured; skipping crates.io"
            [ "${{ inputs.language }}" = all ] && exit 0 || exit 1
          fi
          cargo test --manifest-path packages/rust/Cargo.toml --locked
          cargo publish --manifest-path packages/rust/Cargo.toml --locked
  dotnet:
    needs: validate
    if: inputs.language == 'all' || inputs.language == 'dotnet'
    runs-on: ubuntu-latest
    environment: sdk-release
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Publish to NuGet
        shell: bash
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::warning::NUGET_API_KEY is not configured; skipping NuGet"
            [ "${{ inputs.language }}" = all ] && exit 0 || exit 1
          fi
          version="$(tr -d '\r\n' < VERSION)"
          dotnet test packages/dotnet/ArtifactD.ClientFeedback.Tests -c Release
          dotnet pack packages/dotnet/ArtifactD.ClientFeedback -c Release -o nupkgs -p:Version="$version"
          dotnet nuget push "nupkgs/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
