name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: dropdown
    id: sdk
    attributes:
      label: SDK
      options: [.NET, Python, Node.js, Rust, PHP]
    validations: {required: true}
  - type: input
    id: version
    attributes: {label: SDK version}
    validations: {required: true}
  - type: textarea
    id: what
    attributes: {label: "What happened, and what did you expect?"}
    validations: {required: true}
  - type: textarea
    id: repro
    attributes: {label: Minimal reproduction}
